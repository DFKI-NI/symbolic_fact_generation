# Specify the fact name, the module where the fact generation class resides, the fact generation class and optionally any parameters for the class constructor.
# - fact name: {module: 'module name as string', class: 'class name as string', params: [parameters for class constructor as list]}
# The class needs to have a generate_facts() method, which generates the specified facts and returns them as a List of Facts.
# 
# Examples:
# - robot_at: {module: 'symbolic_fact_generation.robot_facts_generator', class: 'RobotAtGenerator', params: []}
# - on: {module: 'symbolic_fact_generation.on_fact_generator', class: 'OnGenerator',
#        params: [['relay', 'screwdriver', 'multimeter', 'power_drill_with_grip', 'klt'],
#                 '/pick_pose_selector_node/pose_selector_class_query',
#                 '/mobipick/pick_object_node/planning_scene_boxes']}
# The robot_at fact is generated by the RobotAtGenerator class in the symbolic_fact_generation.robot_facts_generator module.
#
# The on fact is generated by the OnGenerator class in the symbolic_fact_generator.on_fact_generator module.
# Its constructor parameters are passed as a list. The final get-all service is
# optional and enables discovery of classes inserted at runtime.
# The signature of the __init__ method looks like this:
#   __init__(self, fact_name: str, objects_of_interest: List[str], container_objects: List[str], query_srv_str: str, planning_scene_param: str, get_all_srv_str: str)

# TABLES DEMO
facts:
  - 'robot_at': {
    module: 'symbolic_fact_generation.robot_facts_generator',
    class: 'RobotAtGenerator',
    params: [
              '/map',
              '/mobipick/base_link',
              '',
              '/mobipick/tables_demo_planning',
              0.2,
              0.015,
              'unknown_pose'
            ]
  }
  - 'robot_has_arm_posture': {
    module: 'symbolic_fact_generation.robot_facts_generator',
    class: 'HasArmPostureGenerator',
    params: [
              '/mobipick/',
              '/mobipick/joint_states',
              '',
              0.01,
              'unknown']
  }
  # A zero-argument predicate which is present when the gripper did not reach
  # its fully closed joint position. Evaluate it after commanding a close.
  # Set the effort threshold (the fifth parameter) above zero to additionally
  # require joint effort; it is disabled by default because the real-hardware
  # adapter reports 0.0. The next two parameters configure fully open. The
  # last one holds a confirming effort sample for that many seconds: Gazebo
  # reports zero effort on physics steps in which the finger exceeds its URDF
  # velocity limit while bouncing on the object, which otherwise makes the
  # fact flicker at the joint_states rate.
  - 'gripper_has_object': {
    module: 'symbolic_fact_generation.gripper_facts_generator',
    class: 'GripperHasObjectGenerator',
    params: [
              '/mobipick/joint_states',
              'mobipick/gripper_finger_joint',
              0.755,
              0.01,
              0.1,
              0.0,
              0.06,
              0.5
            ]
  }
  - 'on': {
    module: 'symbolic_fact_generation.on_fact_generator',
    class: 'OnGenerator',
    params: [
              ['relay', 'screwdriver', 'multimeter', 'power_drill_with_grip', 'klt', 'hot_glue_gun'],
              ['klt'],
              '/pick_pose_selector_node/pose_selector_class_query',
              '/mobipick/pick_object_node/planning_scene_boxes',
              '/pick_pose_selector_node/pose_selector_get_all'
            ]
  }
